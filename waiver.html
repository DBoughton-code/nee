<script>
  // ----------------------------------------------------
  // SIGNATURE PAD CANVAS ENGINE
  // ----------------------------------------------------
  const canvas = document.getElementById('sigCanvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;
  let hasSigned = false;

  function resizeCanvas() {
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    canvas.width = canvas.offsetWidth * ratio;
    canvas.height = canvas.offsetHeight * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#04121d';
  }

  window.addEventListener('resize', resizeCanvas);
  document.addEventListener('DOMContentLoaded', () => {
    resizeCanvas();
  });

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function startDraw(e) {
    isDrawing = true;
    hasSigned = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    e.preventDefault();
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    e.preventDefault();
  }

  function stopDraw() { isDrawing = false; }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  window.addEventListener('mouseup', stopDraw);
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  window.addEventListener('touchend', stopDraw);

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasSigned = false;
  }

  // ----------------------------------------------------
  // BULLETPROOF PDF GENERATION (UI TOGGLE)
  // ----------------------------------------------------
  function generateAndSavePDF() {
    const custName = document.getElementById('custName').value.trim();
    const wo = document.getElementById('workOrder').value.trim();
    const address = document.getElementById('serviceAddress').value.trim();
    const techId = document.getElementById('techId').value.trim();
    const techEmail = document.getElementById('techEmail').value.trim();
    const scope = document.getElementById('drillScope').value;
    const notes = document.getElementById('drillNotes').value.trim() || 'Standard entry hole per agreement';

    if (!custName || !wo || !address || !techId) {
      alert("Please fill in Customer Name, WO #, Service Address, and Tech ID.");
      return;
    }

    if (!hasSigned) {
      alert("Customer signature is required before exporting the waiver.");
      return;
    }

    // Force browser to scroll to absolute top to prevent html2canvas blank space bug
    window.scrollTo(0, 0);

    const now = new Date();
    const dateFormatted = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    // Populate PDF Template
    document.getElementById('pdf-date').textContent = dateFormatted;
    document.getElementById('pdf-wo').textContent = wo;
    document.getElementById('pdf-custname').textContent = custName;
    document.getElementById('pdf-techid').textContent = techId;
    document.getElementById('pdf-address').textContent = address;
    document.getElementById('pdf-scope').textContent = scope;
    document.getElementById('pdf-notes').textContent = notes;
    document.getElementById('pdf-signed-date').textContent = dateFormatted;
    document.getElementById('pdf-sig-img').src = canvas.toDataURL('image/png');

    const mainUI = document.getElementById('main-ui');
    const pdfElement = document.getElementById('pdf-template');
    
    // TOGGLE: Hide UI, Show Template
    mainUI.style.display = 'none';
    document.body.style.backgroundColor = '#ffffff';
    pdfElement.style.display = 'block';

    const filename = `Drill_Waiver_WO_${wo}_${custName.replace(/\s+/g, '_')}.pdf`;

    const opt = {
      margin:       0.4,
      filename:     filename,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true, scrollY: 0 }, 
      jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(pdfElement).save().then(() => {
      // TOGGLE: Hide Template, Show UI
      pdfElement.style.display = 'none';
      document.body.style.backgroundColor = 'var(--bg)';
      mainUI.style.display = 'flex';

      // Delay the email prompt so the browser has time to finish the download
      setTimeout(() => {
        if (techEmail) {
          const sendEmail = confirm(`✅ PDF Downloaded Successfully!\n\n(Check your iPhone 'Files' app or Chrome Downloads).\n\nWould you like to open your email app to send a copy to ${techEmail}?`);
          
          if (sendEmail) {
            const mailSubject = encodeURIComponent(`Drilling Waiver Copy - WO# ${wo} - ${custName}`);
            const mailBody = encodeURIComponent(
              `Hi Tech,\n\nThe customer (${custName}) at ${address} has signed the drilling waiver for Work Order #${wo}.\n\n` +
              `Scope: ${scope}\n` +
              `Notes: ${notes}\n` +
              `Date Signed: ${dateFormatted}\n\n` +
              `The generated PDF (${filename}) has been downloaded to your device downloads folder. Attach it to your job closeout.`
            );
            window.location.href = `mailto:${techEmail}?subject=${mailSubject}&body=${mailBody}`;
          }
        } else {
          alert(`✅ Signed waiver downloaded!\n\nFile Name: ${filename}\n\nCheck your 'Files' app or browser downloads folder.`);
        }
      }, 800); // 800ms delay to let the download fire cleanly
    });
  }
</script>
