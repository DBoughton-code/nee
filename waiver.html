<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exterior / Interior Drilling Consent Waiver</title>

  <!-- html2pdf bundle for client-side PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0f19;
      --card-bg: #131c2e;
      --card-border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --cyan: #06b6d4;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --radius: 10px;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Main UI Wrapper */
    #main-ui {
      display: flex;
      justify-content: center;
      padding: 16px;
      padding-bottom: 60px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .nav-bar { display: flex; align-items: center; }

    .btn-back {
      background: #18233a; color: var(--text); border: 1px solid var(--card-border);
      border-radius: var(--radius); padding: 6px 12px; font-size: 0.8rem;
      font-weight: 700; text-decoration: none; display: inline-flex;
      align-items: center; gap: 6px;
    }
    .btn-back:hover { background: #243452; border-color: var(--cyan); color: var(--cyan); }

    header { text-align: center; padding: 4px 0 10px 0; border-bottom: 1px solid var(--card-border); }
    h1 { font-size: 1.2rem; font-weight: 900; color: var(--amber); display: flex; align-items: center; justify-content: center; gap: 6px; }
    p.sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    input, select, textarea { width: 100%; background: #090e17; border: 1px solid var(--card-border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 0.85rem; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--cyan); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* Legal Box */
    .legal-box { background: #090e17; border: 1px solid var(--card-border); border-radius: 6px; padding: 10px; font-size: 0.73rem; color: #cbd5e1; line-height: 1.5; max-height: 140px; overflow-y: auto; }
    .legal-box p { margin-bottom: 8px; }

    /* Signature Canvas */
    .sig-wrapper { display: flex; flex-direction: column; gap: 6px; }
    .canvas-container { background: #ffffff; border-radius: 6px; border: 2px dashed var(--cyan); touch-action: none; }
    canvas { width: 100%; height: 160px; display: block; cursor: crosshair; }
    .sig-actions { display: flex; justify-content: space-between; align-items: center; }
    .btn-clear { background: transparent; border: 1px solid var(--card-border); color: var(--rose); font-size: 0.72rem; font-weight: 700; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    
    .btn-submit { width: 100%; background: var(--emerald); color: #04121d; border: none; border-radius: var(--radius); padding: 12px; font-size: 0.9rem; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; }
    .btn-submit:hover { background: #34d399; }
