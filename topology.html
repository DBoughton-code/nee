<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xfinity Field Tech Demarc & Topology Calculator</title>
  <style>
    /* CSS Reset & Design Tokens */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-main: #0b0f19;
      --card-bg: #131c2e;
      --card-hover: #18233a;
      --card-border: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
      
      --cyan: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.15);
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.15);
      --amber: #f59e0b;
      --amber-glow: rgba(245, 158, 11, 0.15);
      --rose: #f43f5e;
      --rose-glow: rgba(244, 63, 94, 0.15);
      --purple: #a855f7;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      padding: 16px;
      padding-bottom: 60px;
    }

    .container {
      max-width: 940px;
      margin: 0 auto;
    }

    /* Back Navigation Bar */
    .nav-top-bar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn-back {
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 8px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-back:hover {
      background: #27354f;
      border-color: var(--cyan);
      color: var(--cyan);
    }

    /* Header */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .pht-header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .badge-pass {
      background: rgba(16, 185, 129, 0.12);
      color: var(--emerald);
      border-color: var(--emerald);
    }

    .badge-marginal {
      background: rgba(245, 158, 11, 0.12);
      color: var(--amber);
      border-color: var(--amber);
    }

    .badge-fail {
      background: rgba(244, 63, 94, 0.12);
      color: var(--rose);
      border-color: var(--rose);
    }

    /* Layout Grid */
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (min-width: 700px) {
      .grid-2col {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* Cards */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 16px;
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Inputs & Steppers */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .input-group {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 5px;
    }

    .stepper-input {
      display: flex;
      align-items: center;
      background: #090e17;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .step-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 8px 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }

    .step-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    input[type="number"], select {
      width: 100%;
      background: #090e17;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
    }

    .stepper-input input[type="number"] {
      border: none;
      background: transparent;
    }

    input[type="number"]:focus, select:focus {
      outline: none;
      border-color: var(--cyan);
    }

    /* Sliders */
    .slider-wrap {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .slider-val {
      font-weight: 800;
      color: var(--cyan);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    /* Alerts */
    .alert-banner {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.72rem;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .alert-oes {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid var(--rose);
      color: #fda4af;
    }

    .alert-terminator {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid var(--amber);
      color: #fde68a;
      margin-top: 12px;
    }

    .alert-shortfall {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid var(--rose);
      color: #fda4af;
      margin-top: 10px;
    }

    /* Counter */
    .counter-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #090e17;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 4px;
    }

    .counter-btn {
      background: #18233a;
      border: 1px solid var(--card-border);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .counter-btn:hover {
      background: #243452;
    }

    .counter-val {
      font-size: 1rem;
      font-weight: 800;
      color: var(--emerald);
      text-align: center;
    }

    /* Mode Selection Bar */
    .mode-bar {
      display: flex;
      background: #090e17;
      padding: 4px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
      margin-bottom: 16px;
      gap: 6px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: none;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      color: var(--text-muted);
      background: transparent;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mode-btn.active {
      background: var(--cyan);
      color: #04121d;
      box-shadow: 0 2px 8px rgba(6, 182, 212, 0.35);
    }

    /* Manual Splitter Grid */
    .splitter-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    @media (min-width: 600px) {
      .splitter-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 800px) {
      .splitter-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .splitter-btn {
      background: #090e17;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 10px 8px;
      text-align: left;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .splitter-btn:hover {
      border-color: var(--cyan);
      background: var(--card-hover);
    }

    .splitter-btn.selected {
      border-color: var(--cyan);
      background: var(--cyan-glow);
      box-shadow: 0 0 0 1px var(--cyan);
    }

    .splitter-btn.cascade {
      border-color: rgba(244, 63, 94, 0.4);
      background: rgba(244, 63, 94, 0.06);
    }

    .splitter-btn.cascade.selected {
      border-color: var(--rose);
      background: var(--rose-glow);
      box-shadow: 0 0 0 1px var(--rose);
    }

    .splitter-btn.disabled {
      opacity: 0.45;
      border-style: dashed;
      cursor: not-allowed;
    }

    .s-name {
      font-size: 0.78rem;
      font-weight: 800;
      color: #ffffff;
    }

    .s-meta {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .s-loss {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--cyan);
    }

    /* Hero Banner */
    .hero-banner {
      background: linear-gradient(180deg, #162238 0%, #0d1524 100%);
      border: 2px solid var(--cyan);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: border-color 0.25s ease;
    }

    .hero-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .hero-title-area {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hero-tag {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--cyan);
    }

    .hero-name {
      font-size: 1.15rem;
      font-weight: 900;
      color: #ffffff;
    }

    .hero-desc {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    /* Ground Block Dedicated Strip */
    .gb-strip {
      background: rgba(168, 85, 247, 0.08);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .gb-strip:hover {
      background: rgba(168, 85, 247, 0.14);
      border-color: var(--purple);
    }

    .gb-label-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gb-badge {
      background: var(--purple);
      color: #0b0f19;
      font-size: 0.65rem;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
    }

    .gb-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: #ffffff;
    }

    .gb-readings {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .gb-val-box {
      text-align: right;
    }

    .gb-val-tag {
      font-size: 0.62rem;
      color: var(--text-muted);
      text-transform: uppercase;
      display: block;
    }

    .gb-val-num {
      font-size: 1.05rem;
      font-weight: 900;
      color: #e9d5ff;
    }

    /* 3-Card Device Telemetry Grid */
    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 600px) {
      .telemetry-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .telemetry-card {
      background: #090e17;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .telemetry-card:hover {
      background: #111a2e;
      border-color: var(--cyan);
      transform: translateY(-2px);
    }

    .t-label {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .t-val {
      font-size: 1.25rem;
      font-weight: 900;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      margin-bottom: 2px;
    }

    .t-sub {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .val-ideal { color: var(--emerald); }
    .val-safe { color: var(--cyan); }
    .val-warn { color: var(--amber); }
    .val-fail { color: var(--rose); }

    /* Port Guide Box */
    .port-box {
      margin-top: 14px;
      background: #090e17;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 12px;
    }

    .port-box-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .port-guide-text {
      font-size: 0.74rem;
      color: var(--text-main);
      line-height: 1.6;
    }

    /* Evaluated List */
    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 16px;
    }

    .topology-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .topology-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #090e17;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .topology-row:hover {
      border-color: var(--cyan);
      background: var(--card-hover);
    }

    .topology-row.active {
      border-color: var(--cyan);
      background: rgba(6, 182, 212, 0.08);
      box-shadow: 0 0 0 1px var(--cyan);
    }

    .topology-row.cascade-row {
      border-color: rgba(244, 63, 94, 0.4);
      background: rgba(244, 63, 94, 0.04);
    }

    .row-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .row-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: white;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .row-meta {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .row-metrics {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.76rem;
      font-weight: 700;
    }

    /* Copy Button */
    .btn-copy {
      width: 100%;
      background: var(--cyan);
      color: #04121d;
      border: none;
      border-radius: var(--radius-lg);
      padding: 14px;
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-copy:hover {
      background: #22d3ee;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
    }

    /* Modal Backdrop & Popup */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #111a2e;
      border: 1px solid var(--cyan);
      border-radius: var(--radius-lg);
      max-width: 560px;
      width: 100%;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      animation: modalSlide 0.2s ease-out;
    }

    @keyframes modalSlide {
      from { transform: translateY(16px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .modal-category {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: white;
      margin-top: 2px;
    }

    .modal-close {
      background: #1e293b;
      border: none;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: var(--rose);
    }

    .modal-body {
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.65;
    }

    .modal-body h4 {
      font-size: 0.82rem;
      color: var(--cyan);
      margin-top: 12px;
      margin-bottom: 4px;
      font-weight: 800;
    }

    .modal-body table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      margin-bottom: 12px;
      font-size: 0.72rem;
    }

    .modal-body th, .modal-body td {
      border: 1px solid var(--card-border);
      padding: 6px 8px;
      text-align: left;
    }

    .modal-body th {
      background: #090e17;
      color: var(--text-muted);
    }

    .modal-body p {
      margin-bottom: 8px;
    }

    .modal-body ul, .modal-body ol {
      margin-left: 18px;
      margin-bottom: 10px;
    }

    .modal-body li {
      margin-bottom: 4px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--emerald);
      color: #04121d;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Top Navigation Back to Hub -->
    <div class="nav-top-bar">
      <button type="button" class="btn-back" onclick="window.location.href='index.html'">
        ❮ Main Menu
      </button>
    </div>

    <!-- Top Header -->
    <header>
      <div>
        <div class="brand-title">
          <span>📶</span> XFINITY FIELD TECH DEMARC &amp; TOPOLOGY
        </div>
        <div class="brand-subtitle">
          Expected Ground Block Levels &bull; Single-Demarc Topologies &bull; Zero Cascades
        </div>
      </div>
      <div id="phtBadge" class="pht-header-badge badge-pass" onclick="openModal('pht')">
        <span>✓ PHT PASSING</span>
      </div>
    </header>

    <!-- Tap & Premise Inputs -->
    <div class="grid-2col">

      <!-- Tap & Drop Input -->
      <div class="card">
        <div class="card-title">
          <span class="dot" style="background: var
