<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field QC Inspection Log</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --input-bg: #0f172a;
      --input-border: #475569;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      text-align: center;
      padding: 8px 0;
    }

    .header h2 {
      margin: 0;
      color: var(--primary);
      font-size: 1.4rem;
    }

    .header p {
      margin: 4px 0 0 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text);
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    input, select, textarea {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background-color: var(--input-bg);
      color: var(--text);
      font-size: 0.95rem;
      box-sizing: border-box;
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .photo-box {
      border: 2px dashed var(--card-border);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
      background: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 130px;
      cursor: pointer;
      position: relative;
    }

    .photo-box.has-photo {
      border-style: solid;
      border-color: var(--success);
      background: #064e3b22;
    }

    .photo-box label {
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
    }

    .photo-box img {
      max-width: 100%;
      max-height: 90px;
      border-radius: 6px;
      margin-top: 6px;
      object-fit: cover;
    }

    .photo-icon {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    .badge {
      font-size: 0.7rem;
      background: var(--success);
      color: white;
      padding: 2px 6px;
      border-radius: 10px;
      margin-top: 4px;
    }

    .addr-tag {
      font-size: 0.65rem;
      color: #4ade80;
      margin-top: 4px;
      font-weight: 600;
      line-height: 1.2;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 8px;
    }

    .btn:hover { background-color: var(--primary-hover); }

    .btn-secondary {
      background-color: #334155;
      color: var(--text);
      padding: 10px;
      font-size: 0.9rem;
    }

    .btn-reset {
      background-color: #475569;
      margin-top: 8px;
    }

    input[type="file"] {
      display: none;
    }

    .status-msg {
      font-size: 0.85rem;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      margin-top: 8px;
      display: none;
    }

    .status-warning { background: #78350f; color: #fef3c7; }
    .status-info { background: #075985; color: #e0f2fe; }

    .remove-btn {
      position: absolute;
      top: 4px;
      right: 6px;
      color: var(--danger);
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 id="headerTitle">Prince Telecom QC</h2>
    <p>Field Inspection & Geotagged Photo Log</p>
  </div>

  <!-- Job Details -->
  <div class="card">
    <div class="card-title">Job Details</div>

    <div class="form-group">
      <label for="qcType">Inspection Standard *</label>
      <select id="qcType" onchange="updateQCType()">
        <option value="Prince Telecom QC">Prince Telecom QC</option>
        <option value="Comcast QC">Comcast QC</option>
      </select>
    </div>
    
    <div class="form-group">
      <label for="techNum">Tech Number *</label>
      <input type="text" id="techNum" placeholder="e.g. T-10492">
    </div>

    <div class="form-group">
      <label for="address">Street Address *</label>
      <input type="text" id="address" placeholder="e.g. 123 Main St">
    </div>

    <div class="form-group">
      <label for="city">City *</label>
      <input type="text" id="city" placeholder="e.g. Hartford">
    </div>

    <div class="form-group">
      <label for="state">State *</label>
      <input type="text" id="state" placeholder="e.g. CT">
    </div>

    <div class="form-group">
      <label for="notes">Tech Notes (Optional)</label>
      <textarea id="notes" placeholder="Add any access notes, exceptions, or observations..."></textarea>
    </div>
  </div>

  <!-- Required QC Photos -->
  <div class="card">
    <div class="card-title">Required QC Photos (4)</div>
    
    <div class="photo-grid">
      <!-- Photo 1: Tap -->
      <div class="photo-box" id="box-tap" onclick="triggerCamera('input-tap')">
        <span class="photo-icon">📷</span>
        <label>1. Tap</label>
        <span id="badge-tap" style="display:none;" class="badge">Stamped ✓</span>
        <div id="addr-tap" class="addr-tag"></div>
        <img id="prev-tap" style="display:none;" />
        <input type="file" id="input-tap" accept="image/*" capture="environment" onchange="processPhoto(event, 'tap')">
      </div>

      <!-- Photo 2: Bond Block -->
      <div class="photo-box" id="box-bond" onclick="triggerCamera('input-bond')">
        <span class="photo-icon">📷</span>
        <label>2. Bond Block w/ Tags</label>
        <span id="badge-bond" style="display:none;" class="badge">Stamped ✓</span>
        <div id="addr-bond" class="addr-tag"></div>
        <img id="prev-bond" style="display:none;" />
        <input type="file" id="input-bond" accept="image/*" capture="environment" onchange="processPhoto(event, 'bond')">
      </div>

      <!-- Photo 3: House Attachment -->
      <div class="photo-box" id="box-house" onclick="triggerCamera('input-house')">
        <span class="photo-icon">📷</span>
        <label>3. House Attachment</label>
        <span id="badge-house" style="display:none;" class="badge">Stamped ✓</span>
        <div id="addr-house" class="addr-tag"></div>
        <img id="prev-house" style="display:none;" />
        <input type="file" id="input-house" accept="image/*" capture="environment" onchange="processPhoto(event, 'house')">
      </div>

      <!-- Photo 4: Overall Side of House -->
      <div class="photo-box" id="box-side" onclick="triggerCamera('input-side')">
        <span class="photo-icon">📷</span>
        <label>4. Side of House</label>
        <span id="badge-side" style="display:none;" class="badge">Stamped ✓</span>
        <div id="addr-side" class="addr-tag"></div>
        <img id="prev-side" style="display:none;" />
        <input type="file" id="input-side" accept="image/*" capture="environment" onchange="processPhoto(event, 'side')">
      </div>
    </div>
  </div>

  <!-- Additional Photos Section -->
  <div class="card">
    <div class="card-title">
      <span>Additional Photos</span>
      <span id="extraCount" style="font-size:0.8rem; color:var(--text-muted);">(0)</span>
    </div>
    <div class="photo-grid" id="extraPhotosGrid"></div>
    <button class="btn btn-secondary" onclick="addExtraPhotoSlot()" style="margin-top: 12px;">➕ Add Extra Photo</button>
  </div>

  <!-- Submit Action -->
  <div class="card">
    <div id="status" class="status-msg"></div>
    <button id="submitBtn" class="btn" onclick="submitQC()">📧 Send QC Inspection to Supervisor</button>
    <button class="btn btn-reset" onclick="resetForm()">Clear & Start New Job</button>
  </div>
</div>

<script>
  const requiredPhotos = { tap: null, bond: null, house: null, side: null };
  const extraPhotos = [];
  let extraCounter = 0;

  const SUPERVISOR_EMAIL = "Donald.boughton@princetown.com";

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('techNum').value = localStorage.getItem('qc_tech_num') || '';
    document.getElementById('city').value = localStorage.getItem('qc_city') || '';
    document.getElementById('state').value = localStorage.getItem('qc_state') || '';
    document.getElementById('qcType').value = localStorage.getItem('qc_type') || 'Prince Telecom QC';

    updateQCType();

    document.getElementById('techNum').addEventListener('input', (e) => localStorage.setItem('qc_tech_num', e.target.value));
    document.getElementById('city').addEventListener('input', (e) => localStorage.setItem('qc_city', e.target.value));
    document.getElementById('state').addEventListener('input', (e) => localStorage.setItem('qc_state', e.target.value));

    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(() => {}, () => {}, { enableHighAccuracy: true });
    }
  });

  function updateQCType() {
    const val = document.getElementById('qcType').value;
    document.getElementById('headerTitle').textContent = val;
    localStorage.setItem('qc_type', val);
  }

  function triggerCamera(inputId) {
    document.getElementById(inputId).click();
  }

  function getAddressFromGPS() {
    return new Promise((resolve) => {
      const userAddr = document.getElementById('address').value.trim();
      const userCity = document.getElementById('city').value.trim();
      const userState = document.getElementById('state').value.trim();

      if (!("geolocation" in navigator)) {
        resolve(formatManualAddress(userAddr, userCity, userState));
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          try {
            const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
            const data = await resp.json();

            if (data && data.address) {
              const road = data.address.road || data.address.pedestrian || userAddr;
              const houseNum = data.address.house_number || '';
              const city = data.address.city || data.address.town || data.address.village || userCity;
              const state = data.address.state || userState;

              const fullStreet = [houseNum, road].filter(Boolean).join(' ');
              const resolvedStr = [fullStreet, city, state].filter(Boolean).join(', ');

              if (resolvedStr) {
                resolve(resolvedStr);
                return;
              }
            }
          } catch (err) {}

          resolve(formatManualAddress(userAddr, userCity, userState) || `GPS: ${lat.toFixed(5)}, ${lng.toFixed(5)}`);
        },
        () => resolve(formatManualAddress(userAddr, userCity, userState) || "Location Unavailable"),
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
      );
    });
  }

  function formatManualAddress(addr, city, state) {
    return [addr, city, state].filter(Boolean).join(', ');
  }

  async function processPhoto(event, key, isExtra = false) {
    const file = event.target.files[0];
    if (!file) return;

    showStatus("Fetching location address & stamping photo...", "info");

    const locationAddress = await getAddressFromGPS();
    const timestamp = new Date().toLocaleString();
    const techNum = document.getElementById('techNum').value.trim() || 'Tech';
    const qcType = document.getElementById('qcType').value;

    const img = new Image();
    img.src = URL.createObjectURL(file);

    img.onload = function() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = img.width;
      canvas.height = img.height;

      ctx.drawImage(img, 0, 0);

      const barHeight = Math.max(canvas.height * 0.085, 45);
      ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
      ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight);

      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${Math.max(canvas.height * 0.022, 14)}px sans-serif`;
      
      const textLine1 = `${qcType.toUpperCase()} | TECH: ${techNum} | ${timestamp}`;
      const textLine2 = `LOCATION: ${locationAddress}`;

      ctx.fillText(textLine1, 15, canvas.height - (barHeight / 2) - 2);
      ctx.fillText(textLine2, 15, canvas.height - (barHeight / 6));

      canvas.toBlob((blob) => {
        const stampedFile = new File([blob], file.name, { type: 'image/jpeg' });
        const stampedDataUrl = canvas.toDataURL('image/jpeg', 0.85);

        if (!isExtra) {
          requiredPhotos[key] = { file: stampedFile, dataUrl: stampedDataUrl };
          document.getElementById(`prev-${key}`).src = stampedDataUrl;
          document.getElementById(`prev-${key}`).style.display = 'block';
          document.getElementById(`badge-${key}`).style.display = 'inline-block';
          document.getElementById(`addr-${key}`).textContent = locationAddress;
          document.getElementById(`box-${key}`).classList.add('has-photo');
        } else {
          extraPhotos[key] = { file: stampedFile, dataUrl: stampedDataUrl };
          document.getElementById(`prev-extra-${key}`).src = stampedDataUrl;
          document.getElementById(`prev-extra-${key}`).style.display = 'block';
          document.getElementById(`badge-extra-${key}`).style.display = 'inline-block';
          document.getElementById(`addr-extra-${key}`).textContent = locationAddress;
          document.getElementById(`box-extra-${key}`).classList.add('has-photo');
        }

        hideStatus();
      }, 'image/jpeg', 0.85);
    };
  }

  function addExtraPhotoSlot() {
    extraCounter++;
    const id = extraCounter;
    extraPhotos[id] = null;

    const grid = document.getElementById('extraPhotosGrid');
    const box = document.createElement('div');
    box.className = 'photo-box';
    box.id = `box-extra-${id}`;
    box.setAttribute('onclick', `triggerCamera('input-extra-${id}')`);

    box.innerHTML = `
      <span class="remove-btn" onclick="event.stopPropagation(); removeExtraPhoto(${id})">&times;</span>
      <span class="photo-icon">📷</span>
      <label>Extra #${id}</label>
      <span id="badge-extra-${id}" style="display:none;" class="badge">Stamped ✓</span>
      <div id="addr-extra-${id}" class="addr-tag"></div>
      <img id="prev-extra-${id}" style="display:none;" />
      <input type="file" id="input-extra-${id}" accept="image/*" capture="environment" onchange="processPhoto(event, ${id}, true)">
    `;

    grid.appendChild(box);
    updateExtraCount();
  }

  function removeExtraPhoto(id) {
    extraPhotos[id] = null;
    const box = document.getElementById(`box-extra-${id}`);
    if (box) box.remove();
    updateExtraCount();
  }

  function updateExtraCount() {
    const validCount = extraPhotos.filter(p => p !== null).length;
    document.getElementById('extraCount').textContent = `(${validCount})`;
  }

  async function submitQC() {
    const qcType = document.getElementById('qcType').value;
    const techNum = document.getElementById('techNum').value.trim();
    const address = document.getElementById('address').value.trim();
    const city = document.getElementById('city').value.trim();
    const state = document.getElementById('state').value.trim();
    const notes = document.getElementById('notes').value.trim();

    if (!techNum || !address || !city || !state) {
      showStatus("Please fill in Tech Number, Address, City, and State.", "warning");
      return;
    }

    const missingPhotos = [];
    if (!requiredPhotos.tap) missingPhotos.push("1. Tap");
    if (!requiredPhotos.bond) missingPhotos.push("2. Bond Block");
    if (!requiredPhotos.house) missingPhotos.push("3. House Attachment");
    if (!requiredPhotos.side) missingPhotos.push("4. Side of House");

    if (missingPhotos.length > 0) {
      showStatus("Missing required photos: " + missingPhotos.join(", "), "warning");
      return;
    }

    const timestamp = new Date().toLocaleString();
    const cleanAddress = `${address}_${city}`.replace(/[^a-zA-Z0-9]/g, '_');

    const attachedFiles = [
      new File([requiredPhotos.tap.file], `QC_1_Tap_${cleanAddress}.jpg`, { type: 'image/jpeg' }),
      new File([requiredPhotos.bond.file], `QC_2_BondBlock_${cleanAddress}.jpg`, { type: 'image/jpeg' }),
      new File([requiredPhotos.house.file], `QC_3_HouseAttach_${cleanAddress}.jpg`, { type: 'image/jpeg' }),
      new File([requiredPhotos.side.file], `QC_4_SideOfHouse_${cleanAddress}.jpg`, { type: 'image/jpeg' })
    ];

    let extraIndex = 1;
    extraPhotos.forEach((item) => {
      if (item && item.file) {
        attachedFiles.push(new File([item.file], `QC_Extra_${extraIndex}_${cleanAddress}.jpg`, { type: 'image/jpeg' }));
        extraIndex++;
      }
    });

    const extraPhotosCount = attachedFiles.length - 4;
    const emailSubject = `🚨 ${qcType.toUpperCase()} SUBMISSION | Tech ${techNum} | ${address}, ${city}, ${state}`;
    
    // Engaged, Executive-Level Email Template
    const emailBody = `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📍 ${qcType.toUpperCase()} FIELD AUDIT REPORT
STATUS: COMPLETE & VERIFIED
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

📋 JOB IDENTIFICATION
• Technician ID: ${techNum}
• Inspection Standard: ${qcType}
• Site Address: ${address}, ${city}, ${state}
• Submission Time: ${timestamp}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📷 ATTACHED EVIDENCE SUMMARY (${attachedFiles.length} TOTAL)
✅ Required Core Photos:
   1. Tap Attachment (Address Watermarked)
   2. Bond Block & Grounding (Address Watermarked)
   3. House Attachment Point (Address Watermarked)
   4. Side of House Overview (Address Watermarked)

${extraPhotosCount > 0 ? `➕ Additional Site Photos Attached: ${extraPhotosCount}` : 'ℹ️ Additional Photos: None requested'}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📝 TECHNICIAN FIELD NOTES
${notes ? `"${notes}"` : 'No field notes provided for this installation.'}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
* Generated automatically via Field QC Mobile Inspector. All attached image files contain embedded location and timestamp overlays.`;

    if (navigator.canShare && navigator.canShare({ files: attachedFiles })) {
      try {
        await navigator.share({
          title: emailSubject,
          text: emailBody,
          files: attachedFiles
        });
      } catch (err) {
        if (err.name !== 'AbortError') {
          fallbackMailto(emailSubject, emailBody);
        }
      }
    } else {
      fallbackMailto(emailSubject, emailBody);
    }
  }

  function fallbackMailto(subject, body) {
    const mailtoUrl = `mailto:${SUPERVISOR_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailtoUrl;
  }

  function resetForm() {
    if (confirm("Start a new QC Inspection? Current job photos will be cleared.")) {
      document.getElementById('address').value = '';
      document.getElementById('notes').value = '';
      
      ['tap', 'bond', 'house', 'side'].forEach(key => {
        requiredPhotos[key] = null;
        document.getElementById(`box-${key}`).classList.remove('has-photo');
        document.getElementById(`prev-${key}`).style.display = 'none';
        document.getElementById(`badge-${key}`).style.display = 'none';
        document.getElementById(`addr-${key}`).textContent = '';
        document.getElementById(`input-${key}`).value = '';
      });

      document.getElementById('extraPhotosGrid').innerHTML = '';
      extraPhotos.length = 0;
      extraCounter = 0;
      updateExtraCount();

      document.getElementById('status').style.display = 'none';
    }
  }

  function showStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = `status-msg status-${type}`;
    el.style.display = 'block';
  }

  function hideStatus() {
    document.getElementById('status').style.display = 'none';
  }
</script>

</body>
</html>
